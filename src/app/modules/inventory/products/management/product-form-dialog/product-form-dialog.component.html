<div class="dialog-backdrop" (click)="closed.emit()">
  <section
    class="form-dialog product-form-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="product-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dialog-heading">
      <div>
        <p class="eyebrow">CATÁLOGO</p>
        <h2 id="product-dialog-title">{{ isEditing ? "Editar producto" : "Nuevo producto" }}</h2>
      </div>
      <button type="button" class="icon-button" aria-label="Cerrar" (click)="closed.emit()">
        <i class="pi pi-times"></i>
      </button>
    </div>
    <form (ngSubmit)="save()" class="dialog-form">
      <div class="form-grid">
        <label class="form-field form-field--wide"
          ><span>Nombre del producto <b>*</b></span
          ><input [(ngModel)]="form.name" name="name" maxlength="100" placeholder="Ej. Café molido 500 g" required
        /></label>
        <label class="form-field"
          ><span>SKU <b>*</b></span
          ><input [(ngModel)]="form.sku" name="sku" maxlength="64" placeholder="CAF-001" required
        /></label>
        <div class="form-field">
          <span>Código de barras</span>
          <div class="barcode-input-row">
            <input
              [(ngModel)]="form.barcode"
              name="barcode"
              maxlength="64"
              placeholder="Opcional"
              aria-label="Código de barras"
            />
            <app-barcode-camera-bar label="Escanear código de barras" (scanned)="fillBarcode($event)" />
          </div>
        </div>
        <label class="form-field"
          ><span>Categoría <b>*</b></span
          ><select [(ngModel)]="form.categoryId" name="categoryId" required>
            <option value="">Selecciona una categoría</option>
            @for (category of categories(); track category.id || category._id) {
              <option [ngValue]="category.id || category._id">{{ category.name }}</option>
            }
          </select></label
        >
        <label class="form-field"
          ><span>Estado</span
          ><select [(ngModel)]="form.status" name="status">
            <option value="active">Activo</option>
            <option value="inactive">Inactivo</option>
          </select></label
        >
        <label class="form-field"
          ><span>Precio de compra <small class="field-optional">(opcional)</small></span>
          <div class="money-input">
            <span>$</span
            ><input type="number" min="0" step="1" [(ngModel)]="form.purchasePrice" name="purchasePrice" /></div>
        </label>
        <label class="form-field"
          ><span>Precio de venta <b>*</b></span>
          <div class="money-input">
            <span>$</span
            ><input
              type="number"
              min="0"
              step="1"
              [(ngModel)]="form.salePrice"
              name="salePrice"
              required
            /></div
        ></label>
        <label class="form-field"
          ><span>Stock mínimo</span
          ><input type="number" min="0" step="1" [(ngModel)]="form.minimumStock" name="minimumStock"
        /></label>
        <label class="form-field"
          ><span>Imagen (URL)</span
          ><input type="url" [(ngModel)]="form.image" name="image" maxlength="2048" placeholder="https://…"
        /></label>
        <label class="form-field form-field--wide"
          ><span>Descripción</span
          ><textarea
            [(ngModel)]="form.description"
            name="description"
            rows="3"
            maxlength="1000"
            placeholder="Detalles que te ayuden a identificarlo"
          ></textarea>
        </label>
      </div>

      <p class="form-hint">
        <i class="pi pi-info-circle"></i> Las existencias se inicializan en cero. Registra una
        entrada para agregar stock.
      </p>
      <div class="dialog-actions">
        <button type="button" class="button button-secondary" (click)="closed.emit()">Cancelar</button
        ><button type="submit" class="button button-primary" [disabled]="saving()">
          <i [class]="saving() ? 'pi pi-spin pi-spinner' : 'pi pi-check'"></i
          >{{ saving() ? "Guardando…" : isEditing ? "Guardar cambios" : "Crear producto" }}
        </button>
      </div>
    </form>
  </section>
</div>
